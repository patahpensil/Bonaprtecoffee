name: PostgreSQL contract
on: [pull_request]
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
        env:
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          psql -v ON_ERROR_STOP=1 -f experiments/postgres/ledger.sql
          psql -v ON_ERROR_STOP=1 -f experiments/postgres/verify.sql
          sql="SELECT (ledger.record_receipt('00000000-0000-0000-0000-000000000013',1,3,100,decode(repeat('ab',32),'hex'))).amount"
          pids=()
          for i in {1..8}; do
            PGPASSWORD=test-only-a PGUSER=ledger_a psql -v ON_ERROR_STOP=1 -Atc "$sql" > "/tmp/receipt-$i" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          for i in {1..8}; do test "$(cat "/tmp/receipt-$i")" = 100; done
          test "$(psql -Atc "SELECT count(*) FROM ledger.receipt WHERE command_id='00000000-0000-0000-0000-000000000013'")" = 1
          echo 'Concurrent replay checks passed'
          python3 experiments/postgres/adversarial.py
          sudo apt-get update -qq
          sudo apt-get install -y pgbouncer
          bash experiments/postgres/pool-check.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: test-only-password
          PGDATABASE: postgres
